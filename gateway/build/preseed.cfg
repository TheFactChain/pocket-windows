#_preseed_V1
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string wc-gateway
d-i netcfg/get_domain string invalid
d-i netcfg/hostname string wc-gateway
d-i hw-detect/load_firmware boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password *
d-i passwd/make-user boolean false
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean false
d-i partman-auto/disk string /dev/disk/by-id/virtio-WCROOT
d-i partman/early_command string set -e; ls -l /dev/disk/by-id/ > /dev/ttyS0; disk="$(readlink -f /dev/disk/by-id/virtio-WCROOT)"; test -b "$disk"; debconf-set partman-auto/disk "$disk"; debconf-set grub-installer/bootdev "$disk"
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string wc-root :: 1024 2048 -1 ext4 $primary{ } $bootable{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-auto/choose_recipe select wc-root
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i base-installer/install-recommends boolean false
d-i base-installer/kernel/image string linux-image-amd64
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i debian-installer/allow_unauthenticated boolean false
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string python3 nftables iproute2 ca-certificates util-linux dnsmasq-base acpid
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/vda
d-i preseed/early_command string echo WC_PRESEED_LOADED > /dev/ttyS0; (tail -f /var/log/syslog > /dev/ttyS1 2>/dev/null </dev/null &)
d-i preseed/late_command string set -e; delivery="$(readlink -f /dev/disk/by-id/virtio-WCDELIVERY)"; test -b "$delivery"; mkdir -p /target/tmp/wc-build; tar -xf "$delivery" -C /target/tmp/wc-build; in-target /bin/sh /tmp/wc-build/install.sh; rm -rf /target/tmp/wc-build
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
d-i debian-installer/exit/poweroff boolean true
