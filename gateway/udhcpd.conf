# BusyBox from the same verified Debian ISO; DHCP only on the isolated VM LAN.
start 192.168.233.2
end 192.168.233.2
interface lan0
max_leases 1
static_lease 52:54:00:77:00:03 192.168.233.2
option subnet 255.255.255.0
option router 192.168.233.1
option dns 192.168.233.1
option lease 3600
lease_file /run/windowsclaude/dhcp.leases
pidfile /run/windowsclaude/udhcpd.pid
auto_time 60
